name: exeos
description: "exeOS web and iOS client for the live wallpaper catalog."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  provider: ^6.1.5+1
  go_router: ^17.0.0
  http: ^1.5.0
  url_launcher: ^6.3.2
  video_player: ^2.10.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_functions: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/badges/
    - assets/branding/a-logo1024-glow.png
    - assets/branding/hero_tile_1.jpg
    - assets/branding/hero_tile_2.jpg
    - assets/branding/hero_tile_4.jpg
    - assets/branding/hero_tile_5.jpg
    - assets/branding/play_store_512.png
